spring:
  application:
    name: entrevista-pro-360
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
server:
  error:
    include-message: never
    include-stacktrace: never
# Contratos futuros. El catálogo solo requiere DB_*; no inicializa proveedores.
integraciones:
  jwt-secret: ${JWT_SECRET:}
  aws-region: ${AWS_REGION:us-east-1}
  s3-bucket: ${S3_BUCKET:}
  openai-api-key: ${OPENAI_API_KEY:}
  stt-model: ${STT_MODEL:gpt-4o-mini-transcribe-2025-12-15}
  llm-model: ${LLM_MODEL:gpt-5.4-mini-2026-03-17}
