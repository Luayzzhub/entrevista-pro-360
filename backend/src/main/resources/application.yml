spring:
  application:
    name: entrevista-pro-360
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          java_time_use_direct_jdbc: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: false
server:
  error:
    include-message: never
    include-stacktrace: never
seguridad:
  bcrypt:
    costo: ${BCRYPT_COST:12}
  jwt:
    secret: ${JWT_SECRET:}
    # Sin secreto configurado, IdentidadConfig genera 32 bytes aleatorios por arranque local.
    permitir-clave-efimera: true
# Proveedores externos todavía pendientes.
integraciones:
  aws-region: ${AWS_REGION:us-east-1}
  s3-bucket: ${S3_BUCKET:}
  s3-endpoint-override: ${S3_ENDPOINT_OVERRIDE:}
  ffprobe-bin: ${FFPROBE_BIN:ffprobe}
  openai-api-key: ${OPENAI_API_KEY:}
  stt-model: ${STT_MODEL:gpt-4o-mini-transcribe-2025-12-15}
  llm-model: ${LLM_MODEL:gpt-5.4-mini-2026-03-17}
