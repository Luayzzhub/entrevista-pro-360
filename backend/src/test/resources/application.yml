# H2 reproduce el flujo JPA y ejecuta LAS MISMAS migraciones en modo MySQL.
# No acredita por sí solo tipos, collation ni integridad específica de MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:catalogo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
seguridad:
  bcrypt:
    costo: 4
  jwt:
    secret: clave-exclusiva-de-pruebas-de-al-menos-32-bytes
    permitir-clave-efimera: false
